services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracksense}
      POSTGRES_USER: ${POSTGRES_USER:-tracksense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - tracksense-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - tracksense

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      UDP_PORT: 5005
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracksense}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:-tracksense}
      DATABASE_SSL: disable
      DEVICE_API_KEY: ${DEVICE_API_KEY:?Set DEVICE_API_KEY in the project .env file before starting Compose}
    ports:
      - "${PORT:-3000}:3000/tcp"
      - "${UDP_PORT:-5005}:5005/udp"
    volumes:
      - type: bind
        source: ${DATA_DIR:-./dashboard/data}
        target: /app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tracksense

networks:
  tracksense:
    driver: bridge

volumes:
  tracksense-postgres:
