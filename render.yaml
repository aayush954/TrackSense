services:
  - type: web
    name: tracksense-api
    runtime: node
    plan: free
    rootDir: dashboard
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tracksense-db
          property: connectionString
      - key: DATABASE_SSL
        value: require
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: DEVICE_API_KEY
        generateValue: true

databases:
  - name: tracksense-db
    plan: free
    databaseName: tracksense
    user: tracksense_user
